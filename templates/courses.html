{% extends "base.html" %}

{% block content %}

<h2>Courses</h2>

<form action="/courses/add" method="post">
    Name: <input name="name">
    Credits: <input name="credits">
    Department: <input name="department">
    <button>Add Course</button>
</form>

<ul>
{% for course in courses %}
    <li>{{course.CourseName}} - {{course.Department}}</li>
{% endfor %}
</ul>

{% endblock %}
